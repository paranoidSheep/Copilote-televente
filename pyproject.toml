[project]
name = "copilote-televente"
version = "0.2.0"
description = "Copilote télévente : fiches d'appel, file d'appels et plan d'écoulement générés à partir des données ERP"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["copilote", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "PL", "RET", "TID"]
ignore = [
    "E741",     # « l » est utilisé pour « ligne » dans des compréhensions courtes
    "RUF001",   # caractères typographiques français (« », ’, …) volontaires
    "RUF002",
    "RUF003",
    "PLR0913",  # constructeurs à injection de dépendances : nombreux paramètres assumés
    "PLR2004",  # seuils métier explicites dans les gabarits de texte
    "PLR0912",
    "PLR0915",
    "PLC0415",  # imports locaux volontaires (chargement paresseux des implémentations)
    "N818",     # noms d'exceptions en français (ErreurXxx)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "N802", "PLR0913"]
"scripts/*" = ["T201"]

[tool.coverage.run]
source = ["copilote"]
omit = ["copilote/api/static/*"]
